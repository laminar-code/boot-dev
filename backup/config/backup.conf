# Backup Configuration

# Local backup directory
BACKUP_DIR="$HOME/backups"

# S3 settings (leave empty to disable S3)
S3_BUCKET=""
S3_PREFIX="backups"

# Encryption (set to "true" to enable GPG encryption)
ENCRYPT_BACKUPS="true"
GPG_RECIPIENT=""  # GPG key ID or email, leave empty for symmetric encryption

# Retention (days, 0 to disable)
LOCAL_RETENTION_DAYS=30
S3_RETENTION_DAYS=90

# Compression level (1-9, 9 = max)
COMPRESSION_LEVEL=6

# --- Keys Module ---
# SSH keys directory
SSH_KEYS_DIR="$HOME/.ssh"

# SSL private keys directory
SSL_PRIVATE_DIR="/etc/ssl/private"

# SSL certificates directory (only certs matching private keys are backed up)
SSL_CERTS_DIR="/etc/ssl/certs"

# CA certificates directory
SSL_CA_CERTS_DIR="/usr/local/share/ca-certificates"

# --- Config Module ---
# System config directories
SYSTEM_CONFIG_DIRS="/etc"

# User config directories
USER_CONFIG_DIRS="$HOME/.config $HOME/.local/share"

# Dotfiles to backup (space-separated, relative to HOME)
DOTFILES=".bashrc .bash_profile .profile .zshrc .gitconfig .vimrc"

# --- Pass Module ---
# Pass password store directory
PASS_STORE_DIR="$HOME/.password-store"
